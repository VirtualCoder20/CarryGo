
spring:
  application:
    name: Backend
  Jackson:
    serialization:
      fail-on-empty-beans: false
  main:
    lazy-initialization: true
#datasoruce settings
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: VP-LOCAL-CONN-POOL
#servlet Multipart Settings
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

#jpa settings
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

