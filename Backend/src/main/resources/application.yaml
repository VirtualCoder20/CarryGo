    context-path: /api/v1

app:
  jwt-secret: ${JWT_SECRET}
  jwt-expiration-ms: 86400000
  otp:
    expiry-minutes: 30
    length: 5
  upload:
    diruploads: C:\Users\SHADOW\Pictures\Camera Roll


#if you need to save anything in cloud
aws:
  s3:
    bucketName: user_documents
    region: af-south-1
    folder: document-images
    accessKey: ${AWS_ACCESS_KEY}
    accessSecret: ${AWS_ACCESS_SECRET}

#QuickTeller
QUICKTELLER:
  CLIENTID: ${QUICKTELLER_CLIENTID}
  SECRET: ${QUICKTELLER_SECRET}
  TokenUrl: ${QUICKTELLER_TOKEN_URL}
  Whatsapp_token_send_url: ${QUICKTELLER_WHATSAPP_TOKEN_URL}